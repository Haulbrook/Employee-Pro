# SENTINEL — log-rotate.conf
# Install: sudo cp log-rotate.conf /etc/logrotate.d/sentinel
# Spec: 7-day retention, compressed, /var/log/sentinel/*

/var/log/sentinel/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 sentinel sentinel
    su sentinel sentinel
    sharedscripts
    postrotate
        # Notify long-running services to reopen log files. Errors are non-fatal:
        # if a unit is missing or systemd is unavailable we still keep rotating.
        systemctl kill -s HUP --kill-who=main sentinel-agent.service     2>/dev/null || true
        systemctl kill -s HUP --kill-who=main sentinel-watchdog.service  2>/dev/null || true
        systemctl kill -s HUP --kill-who=main sentinel-dashboard.service 2>/dev/null || true
    endscript
}
